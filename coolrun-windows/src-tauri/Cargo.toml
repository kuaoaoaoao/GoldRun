[package]
name = "coolrun-windows"
version = "0.1.0"
description = "coolRun Windows 托盘版：系统监控 + 金价分析"
edition = "2021"

[lib]
name = "coolrun_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
sysinfo = "0.33"
chrono = "0.4"
chrono-tz = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
