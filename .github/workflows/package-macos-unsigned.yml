name: Package unsigned macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
      POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release app without Developer ID
        run: >
          xcodebuild
          -project CoolRun.xcodeproj
          -scheme CoolRun
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath '${{ runner.temp }}/CoolRun-derived'
          CODE_SIGNING_ALLOWED=NO
          POSTHOG_API_KEY="$POSTHOG_PROJECT_API_KEY"
          POSTHOG_HOST="$POSTHOG_HOST"
          build

      - name: Apply ad hoc signature and verify bundle
        env:
          APP_PATH: ${{ runner.temp }}/CoolRun-derived/Build/Products/Release/CoolRun.app
        run: |
          test -d "$APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create CoolRun DMG
        env:
          APP_PATH: ${{ runner.temp }}/CoolRun-derived/Build/Products/Release/CoolRun.app
          DIST_DIR: ${{ runner.temp }}/CoolRun-dist
          DMG_DIR: ${{ runner.temp }}/CoolRun-dmg
        run: |
          mkdir -p "$DIST_DIR"
          mkdir -p "$DMG_DIR"
          ditto "$APP_PATH" "$DMG_DIR/CoolRun.app"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create \
            -volname "CoolRun" \
            -srcfolder "$DMG_DIR" \
            -ov \
            -format UDZO \
            "$DIST_DIR/CoolRun.dmg"
          test -f "$DIST_DIR/CoolRun.dmg"

      - name: Upload unsigned community build
        uses: actions/upload-artifact@v4
        with:
          name: CoolRun-macOS-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/CoolRun-dist/CoolRun.dmg
          if-no-files-found: error
          retention-days: 30
