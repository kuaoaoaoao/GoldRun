name: Build Windows App

on:
  push:
    tags:
      - "win-v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: coolrun-windows/src-tauri

      - name: Install frontend dependencies
        working-directory: coolrun-windows
        run: npm ci

      - name: Build Tauri app
        working-directory: coolrun-windows
        run: npx tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: GoldRun-windows-installers
          path: |
            coolrun-windows/src-tauri/target/release/bundle/nsis/*.exe
            coolrun-windows/src-tauri/target/release/bundle/msi/*.msi

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            coolrun-windows/src-tauri/target/release/bundle/nsis/*.exe
            coolrun-windows/src-tauri/target/release/bundle/msi/*.msi
