name: Sync GitHub release downloads to PostHog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
      POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}

    steps:
      - name: Fetch releases
        id: releases
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            -o releases.json

      - name: Send download snapshots to PostHog
        if: ${{ env.POSTHOG_PROJECT_API_KEY != '' }}
        run: |
          set -euo pipefail

          jq -c '
            .[]
            | . as $release
            | .assets[]
            | {
                release_id: $release.id,
                release_name: $release.name,
                release_tag: $release.tag_name,
                release_draft: $release.draft,
                release_prerelease: $release.prerelease,
                release_published_at: $release.published_at,
                asset_id: .id,
                asset_name: .name,
                asset_content_type: .content_type,
                asset_size: .size,
                download_count: .download_count,
                browser_download_url: .browser_download_url
              }
          ' releases.json | while read -r asset; do
            payload="$(jq -n \
              --arg api_key "$POSTHOG_PROJECT_API_KEY" \
              --arg distinct_id "github:${{ github.repository }}" \
              --arg event "github_release_download_snapshot" \
              --arg repository "${{ github.repository }}" \
              --arg workflow_run_id "${{ github.run_id }}" \
              --argjson asset "$asset" \
              '{
                api_key: $api_key,
                distinct_id: $distinct_id,
                event: $event,
                properties: ($asset + {
                  repository: $repository,
                  source: "github_api",
                  workflow_run_id: $workflow_run_id
                })
              }'
            )"

            curl -fsSL \
              -X POST \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$POSTHOG_HOST/capture/"
          done
