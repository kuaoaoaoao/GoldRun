name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      POSTHOG_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >
          xcodebuild
          -resolvePackageDependencies
          -project CoolRun.xcodeproj
          -scheme CoolRun

      - name: Build and test macOS app
        run: >
          xcodebuild
          -project CoolRun.xcodeproj
          -scheme CoolRun
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath '${{ runner.temp }}/CoolRun-derived'
          CODE_SIGNING_ALLOWED=NO
          test
