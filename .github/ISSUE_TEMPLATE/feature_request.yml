name: 功能建议
description: 提议一个明确、可验证的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请描述使用场景，而不只是控件或实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 怎样算完成
      placeholder: 列出 2–5 条可以验证的结果。
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 目标平台
      options:
        - macOS 主应用
        - watchOS
        - Windows Tauri 实验版
        - Avalonia 实验版
        - 多平台
    validations:
      required: true
